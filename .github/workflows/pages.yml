# Builds the PHP site into flat HTML and publishes it to GitHub Pages.
# The configure-pages step enables Pages automatically. If your org blocks
# that, set Settings -> Pages -> Build and deployment -> Source to "GitHub
# Actions" once, by hand.

name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show PHP version
        run: php -v

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build

      - name: Check the export looks right
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/assets/css/tailwind.css
          pages=$(ls dist/*.html | wc -l)
          echo "$pages pages built"
          test "$pages" -ge 40

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo if it is not already, so no manual
          # visit to Settings is needed on a fresh clone.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
